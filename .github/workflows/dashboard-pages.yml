name: Publish coverage dashboard

on:
  push:
    branches:
      - akiho-expansion-data
    paths:
      - COVERAGE.csv
      - scripts/build_dashboard.py
      - .github/workflows/dashboard-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from tracked coverage data
        run: python scripts/build_dashboard.py

      - name: Prepare Pages site
        env:
          # This is an unlisted path, not an access-control mechanism. Keeping
          # it here avoids requiring repository-secret administration rights.
          DASHBOARD_PATH: dashboard-7f4c2a91e8b653d0
        run: |
          case "$DASHBOARD_PATH" in
            ""|*[!A-Za-z0-9_-]*)
              echo "DASHBOARD_PATH must contain only letters, numbers, _ or -."
              exit 1
              ;;
          esac
          mkdir -p "_site/$DASHBOARD_PATH"
          cp DASHBOARD.html "_site/$DASHBOARD_PATH/index.html"
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
