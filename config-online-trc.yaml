# OTRC delta config: prompt override only.
# Layer this *before* the model agent-config in the -c chain so the model_name
# from --agent-config wins. run_experiment.py handles that ordering for any
# condition that sets "config" in the CONDITIONS list.
#
# OTRC primitive clears tool-result stubs from history mid-run. The system
# prompt is shorter than the swebench_backticks.yaml default because the
# agent's prior outputs may be cleared, so a verbose "remember the workflow"
# template doesn't help.
agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you briefly explain your reasoning.
