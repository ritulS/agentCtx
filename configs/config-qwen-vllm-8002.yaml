# Identical to config-qwen-vllm.yaml except api_base -> port 8002 (second
# Qwen3.5-35B-A3B vLLM on GPUs 4-7). Used by the gpu4-7 half of the split TB
# prefix-cache ablation (scripts/serving/start_vllm_qwen35_no_prefix_cache_gpu4-7.sh).
agent:
  step_limit: 300
  cost_limit: 0.0
  cost_tracking: ignore_errors
  mode: yolo
  confirm_exit: false

model:
  model_name: "hosted_vllm/Qwen/Qwen3.5-35B-A3B"
  model_class: "litellm_textbased"
  model_kwargs:
    api_base: "http://localhost:8002/v1"
    drop_params: true
    temperature: 0.2
    max_tokens: 4096
  cost_tracking: ignore_errors

environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
