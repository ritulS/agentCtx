# Devstral-Small-2-24B-Instruct-2512 agent config for the isolated cells on the
# 4 "FC majority, SU-free minority" P30S tasks
# (scripts/expansions/run_r2_swe_sandbox_isolated_devstral24b_fcmaj4.sh):
# configs/config-devstral-vllm.yaml (ICLR main-track setting: port 8002, step
# limit 300, max_tokens 4096, litellm default timeout) with ONE change:
#   temperature 0.2 -> 0.0   the user's choice for the isolated sandbox cells
#                            (2026-10-25), as for the Qwen and Devstral-2507 ones.
# The agent model is also the summarizer (SU-full cells), so summaries are
# greedy too; the online-claude-select cell's selector is Claude.
agent:
  step_limit: 300
  cost_limit: 0.0
  cost_tracking: ignore_errors
  mode: yolo
  confirm_exit: false

model:
  model_name: "hosted_vllm/mistralai/Devstral-Small-2-24B-Instruct-2512"
  model_class: "litellm_textbased"
  model_kwargs:
    api_base: "http://localhost:8002/v1"
    drop_params: true
    temperature: 0.0
    max_tokens: 4096
  cost_tracking: ignore_errors

environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
