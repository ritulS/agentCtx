# Identical to config-glm47flash-vllm.yaml except api_base -> port 8004 (second
# GLM-4.7-Flash vLLM on GPUs 4-7). Used by the gpu4-7 half of the split TB ablation.
agent:
  step_limit: 125
  cost_limit: 0.0
  cost_tracking: ignore_errors
  mode: yolo
  confirm_exit: false

model:
  model_name: "hosted_vllm/zai-org/GLM-4.7-Flash"
  model_class: "litellm_textbased"
  model_kwargs:
    api_base: "http://localhost:8004/v1"
    drop_params: true
    temperature: 0.2
    max_tokens: 4096
  cost_tracking: ignore_errors

environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
